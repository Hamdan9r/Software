exact expected fee with assertEqual. Use only valid whole-number inputs of
zero or more. Do not read fees.py or infer expectations from the implementation.
Create or change files only in tests/. Keep the active permissions and do not
request any command outside the sandbox or use the network.
Your output is tests/test_fees.py. Stop once that file exists. Do not run tests,
import fees interactively, or execute the implementation.
